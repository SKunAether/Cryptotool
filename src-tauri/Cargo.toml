[env]
PKG_CONFIG_PATH = "/usr/lib/x86_64-linux-gnu:/usr/share/pkgconfig"
PKG_CONFIG_LIBDIR = "/usr/lib/x86_64-linux-gnu/pkgconfig"
GLIB_2.0_NO_PKG_CONFIG = "0"
GOBJECT_2.0_NO_PKG_CONFIG = "0"
GIO_2.0_NO_PKG_CONFIG = "0"

[package]
name = "cryptotool"
version = "1.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "cryptotool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 强制锁定低版本，覆盖自动更新
glib-sys = "=0.17.0"
gobject-sys = "=0.17.0"
gio-sys = "=0.17.0"

tauri = { version = "2", features = ["tray-icon"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cryptotool-plugin-sdk = { path = "../plugin-sdk" }
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rayon = "1.10"
tauri-plugin-opener = "2.0.0"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v2" }
zeroize = "1"
tempfile = "3"