name: Clean Failed Workflow Runs
on:
  schedule:
    - cron: '0 1 * * *' # 每天凌晨1点执行
  workflow_dispatch: # 手动触发按钮
jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.TOKEN }}
          retain_days: 1
          keep_minimum_runs: 3
          delete_conclusions: failure,cancelled