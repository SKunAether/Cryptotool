name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create-release
        uses: actions/github-script@v6
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              draft: false,
              prerelease: false
            });
            return release.id;

  build:
    needs: create-release
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Rust
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      # Node pnpm
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # ========== Ubuntu 安装步骤：强制启用universe + 安装后校验 ==========
      - name: Install Ubuntu GLib GTK Deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo add-apt-repository universe --yes
          sudo apt update --yes
          # 完整GLib开发包
          sudo apt install -y libglib2.0-dev pkg-config build-essential \
            libgtk-3-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libsoup3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file
          # 强制校验是否安装成功，失败直接中断CI
          pkg-config --modversion glib-2.0
          pkg-config --modversion gobject-2.0
          pkg-config --modversion gio-2.0
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu:/usr/share/pkgconfig" >> $GITHUB_ENV

      # ========== 关键：tauri-action内部强制注入PKG_CONFIG_PATH ==========
      - name: Build & Upload
        uses: tauri-apps/tauri-action@v0
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 这里强制写死，Rust编译脚本一定会读到
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu:/usr/share/pkgconfig