name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create_rel.output.id }}
      tag_name: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_rel
        uses: actions/github-script@v6
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              draft: false,
              prerelease: false
            });
            return { id: data.id };

  build:
    strategy:
      matrix:
        os: [container-ubuntu2204, windows-latest, macos-latest]
    runs-on: ${{ matrix.os == 'container-ubuntu2204' && 'ubuntu-22.04' || matrix.os }}
    container:
      # 固定纯净ubuntu22.04容器，环境完全可控
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      # 仅容器内执行完整依赖安装+构建
      - name: Build Linux inside container
        if: matrix.os == 'container-ubuntu2204'
        run: |
          set -euxo pipefail
          apt update && apt install -y software-properties-common
          add-apt-repository universe -y
          apt update
          # 全套glib三套件+编译依赖
          apt install --reinstall -y \
            pkg-config build-essential file patchelf curl wget \
            libglib2.0-dev libgobject-2.0-dev libgio-2.0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libsoup2.4-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          # 安装pnpm/node/rust
          curl -fsSL https://get.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          curl -fsSL https://get.pnpm.io/install.sh | sh -s -- --version 8
          source "$HOME/.pnpm/env"
          pnpm env use 20
          pnpm install
          # 全局固定pkgconfig变量，容器内所有进程永久生效
          echo 'export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"' >> ~/.bashrc
          echo 'export PKG_CONFIG_LIBDIR="/usr/lib/x86_64-linux-gnu/pkgconfig"' >> ~/.bashrc
          source ~/.bashrc
          # 校验库
          pkg-config --modversion glib-2.0 gobject-2.0 gio-2.0
          # 构建
          TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY }} \
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }} \
          pnpm tauri build --bundles appimage,deb

      # Windows原生构建
      - name: Setup Rust & pnpm Windows
        if: matrix.os == 'windows-latest'
        uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v2
        with: version:8
      - uses: actions/setup-node@v4
        with: node-version:20
      - run: pnpm install
      - name: Build Windows
        if: matrix.os == 'windows-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      # Mac原生构建
      - name: Setup Rust & pnpm Mac
        if: matrix.os == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v2
        with: version:8
      - uses: actions/setup-node@v4
        with: node-version:20
      - run: pnpm install
      - name: Build Mac
        if: matrix.os == 'macos-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin

      # 上传产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-bundle
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg

  upload-release:
    needs: [create-release, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
      - name: Collect Assets
        run: |
          mkdir assets
          find . -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" -o -name "*.dmg" \) -exec mv {} assets/ \;
      - name: Publish to Release
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}