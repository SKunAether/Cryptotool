name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create-release
        uses: actions/github-script@v6
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              draft: false,
              prerelease: false
            });
            return release.id;

  build:
    needs: create-release
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Rust 前置
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2

      # Node & pnpm
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # ========== 核心修复段：Ubuntu 24.04 ==========
      - name: Fix Ubuntu repo + install full GLib/GTK dev
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. 启用universe仓库（关键！默认关闭导致找不到dev包）
          sudo add-apt-repository universe -y
          sudo apt update -y
          # 2. 一次性安装全套GLib/GIO/GObject + Tauri依赖
          sudo apt install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libpango1.0-dev \
            libcairo2-dev \
            libgdk-pixbuf2.0-dev \
            libatk1.0-dev \
            libsoup3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            file
          # 3. 同脚本内临时导出PKG_CONFIG_PATH，子进程编译可继承
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu:/usr/share/pkgconfig"
          # 4. 校验pc文件是否存在（打印日志方便排错）
          echo "==== pkg-config 校验 ===="
          pkg-config --exists glib-2.0 gobject-2.0 gio-2.0
          pkg-config --list-all | grep -E "glib|gobject|gio"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          # 5. 全局写入job环境，后续tauri-action也能读到
          echo "PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu:/usr/share/pkgconfig" >> $GITHUB_ENV

      # Tauri 打包
      - name: Build & upload release assets
        uses: tauri-apps/tauri-action@v0
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}