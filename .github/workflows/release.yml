name: Release


on:

  push:

    tags:

      - "v*"



permissions:

  contents: write



jobs:

  release:


    strategy:

      fail-fast: false

      matrix:

        include:

          - platform: ubuntu-latest

          - platform: windows-latest

          - platform: macos-latest



    runs-on: ${{ matrix.platform }}



    steps:


      # ==========================
      # Checkout
      # ==========================
      - name: Checkout repository
        uses: actions/checkout@v4




      # ==========================
      # Linux dependencies
      # ==========================
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |

          sudo apt update

          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            pkg-config




      # ==========================
      # Node
      # ==========================
      - name: Setup Node
        uses: actions/setup-node@v4

        with:

          node-version: 20




      # ==========================
      # pnpm
      # ==========================
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

        with:

          version: 9




      # ==========================
      # Rust
      # ==========================
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable




      - name: Rust cache
        uses: Swatinem/rust-cache@v2




      # ==========================
      # Frontend
      # ==========================
      - name: Install dependencies

        run: |

          pnpm install




      - name: Build frontend

        run: |

          pnpm build




      # ==========================
      # Tauri Build
      # ==========================
      - name: Build Tauri App

        uses: tauri-apps/tauri-action@v0

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:

          tagName: ${{ github.ref_name }}

          releaseName: "CryptoTool ${{ github.ref_name }}"

          releaseBody: |

            CryptoTool desktop application release.

          releaseDraft: false

          prerelease: false