name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create-release
        uses: actions/github-script@v6
        with:
          script: |
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              draft: false,
              prerelease: false
            });
            return release.id;

  build:
    needs: create-release
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Rust
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      # Node pnpm
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install

      # Ubuntu22.04 官方标准依赖（和cc-switch对齐）
      - name: Install Linux Build Deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo add-apt-repository universe -y
          sudo apt update -y
          sudo apt install -y \
            pkg-config build-essential \
            libglib2.0-dev libgobject-2.0-dev libgio-2.0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libsoup2.4-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
          export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-gnu:/usr/share/pkgconfig
          pkg-config --modversion glib-2.0 gobject-2.0 gio-2.0

      # 不使用tauri-action，原生打包（关键：环境变量完整继承）
      - name: Build Linux App
        if: matrix.os == 'ubuntu-22.04'
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu:/usr/share/pkgconfig
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --bundles appimage,deb

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build

      - name: Build Mac
        if: matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: pnpm tauri build --target universal-apple-darwin

      # 上传产物到release
      - name: Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.result }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg