name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      
      # ----- 强制移除 workspace 配置 -----
      - name: Remove workspace config
        run: |
          rm -f pnpm-workspace.yaml
          if [ -f package.json ]; then
            node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('package.json')); delete pkg.workspaces; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));"
          fi
        shell: bash
      
      # ----- Linux 依赖 -----
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libxcb1-dev \
            libglib2.0-dev
      
      # ----- 安装前端依赖 -----
      - name: Install dependencies
        run: pnpm install
        shell: bash
      
      # ----- 构建 -----
      - name: Build application
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      
      # ----- 上传产物 -----
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/**/*.{deb,msi,dmg,sig}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}