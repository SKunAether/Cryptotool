name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create_rel.output.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_rel
        uses: actions/github-script@v6
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              draft: false,
              prerelease: false
            });
            return { id: data.id };

  build:
    strategy:
      matrix:
        os: [ubuntu2204-container, windows-latest, macos-latest]
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      # 容器内仅安装依赖，不再设置任何环境变量（交给Cargo.toml）
      - name: Install Linux system libs
        run: |
          set -e
          apt update && apt install -y software-properties-common
          add-apt-repository universe -y
          apt update
          apt install --reinstall -y \
            pkg-config build-essential file patchelf \
            libglib2.0-dev libgobject-2.0-dev libgio-2.0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libsoup2.4-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
          # 仅校验库是否存在，变量不用在这里导出
          pkg-config --modversion glib-2.0 gobject-2.0 gio-2.0

      # 安装工具链
      - name: Install Rust & Pnpm
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          curl -fsSL https://get.pnpm.io/install.sh | sh -s -- --version 8
          source "$HOME/.pnpm/env"
          pnpm env use 20
          pnpm install

      # 直接构建，无需任何env注入
      - name: Build Linux bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage,deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: src-tauri/target/release/bundle/**

  build-win-mac:
    needs: create-release
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v2
        with: version:8
      - uses: actions/setup-node@v4
        with: node-version:20
      - run: pnpm install
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-bundle
          path: src-tauri/target/release/bundle/**

  upload-release:
    needs: [create-release, build, build-win-mac]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
      - run: mkdir assets && find . -type f -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" -o -name "*.dmg" -exec mv {} assets/ \;
      - uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}