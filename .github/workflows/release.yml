name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create_rel.output.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Release
        id: create_rel
        uses: actions/github-script@v6
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: context.ref.replace('refs/tags/', ''),
              draft: false,
              prerelease: false
            });
            return { id: data.id };

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v2
        with: version:8
      - uses: actions/setup-node@v4
        with: node-version:20
      - run: pnpm install

      - name: Install Full GLib + Tauri GUI Dependencies
        run: |
          sudo add-apt-repository universe -y
          sudo apt update -y
          # 关键：强制安装三件套，0.18必须，降级0.17也保留保险
          sudo apt install -y --no-install-recommends \
            libglib2.0-dev libgobject-2.0-dev libgio-2.0-dev \
            libgtk-3-dev libwebkit2gtk-4.0-dev libjavascriptcoregtk-4.0-dev \
            libpango1.0-dev libcairo2-dev libgdk-pixbuf2.0-dev libatk1.0-dev \
            libsoup2.4-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file
          # 校验pc文件是否存在
          pkg-config --modversion glib-2.0 gobject-2.0 gio-2.0

      - name: Build Linux AppImage & deb
        env:
          PKG_CONFIG_PATH: /usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles appimage,deb

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: src-tauri/target/release/bundle/**

  build-win-mac:
    needs: create-release
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v2
        with: version:8
      - uses: actions/setup-node@v4
        with: node-version:20
      - run: pnpm install
      - name: Build bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-bundle
          path: src-tauri/target/release/bundle/**

  upload-release:
    needs: [create-release, build-linux, build-win-mac]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
      - run: mkdir assets && find . -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" -o -name "*.dmg" \) -exec mv {} assets/ \;
      - uses: softprops/action-gh-release@v1
        with:
          release_id: ${{ needs.create-release.outputs.release_id }}
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}